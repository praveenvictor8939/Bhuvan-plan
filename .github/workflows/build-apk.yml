name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy web app into www
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp icon-192.png icon-512.png icon-maskable-512.png www/ || true

      - name: Create Android project
        run: npx cap add android

      - name: Add alarm sounds and permissions
        run: |
          mk
