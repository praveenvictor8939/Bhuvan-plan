<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fb;--surface:#ffffff;--ink:#141a33;--mute:#5d6685;--line:#dfe3f0;--field:#eef1fa;
  --brand:#2b3fd6;--brand-ink:#ffffff;--mark:#ffe14d;--ok:#0f9d67;--ok-bg:#dff5ea;
  --warn:#a84a08;--warn-bg:#ffeed9;--bad:#c92a5f;--hero-a:#2b3fd6;--hero-b:#1a26a0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1122;--surface:#161b33;--ink:#edf0ff;--mute:#9aa3c7;--line:#262d4d;--field:#1d2340;
    --brand:#8393ff;--brand-ink:#0d1122;--ok:#3ecf94;--ok-bg:#12352a;--warn:#ffb15c;--warn-bg:#3a2a12;--bad:#ff7aa5;
    --hero-a:#2f43e0;--hero-b:#1a2478;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1122;--surface:#161b33;--ink:#edf0ff;--mute:#9aa3c7;--line:#262d4d;--field:#1d2340;
  --brand:#8393ff;--brand-ink:#0d1122;--ok:#3ecf94;--ok-bg:#12352a;--warn:#ffb15c;--warn-bg:#3a2a12;--bad:#ff7aa5;
  --hero-a:#2f43e0;--hero-b:#1a2478;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hero :focus-visible,.widget :focus-visible{outline-color:#fff}
h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
h2{font-size:24px;font-weight:800;margin:22px 0 10px}
h3{font-size:18px;font-weight:700;margin-bottom:6px}
p{margin:0 0 8px}
.mute{color:var(--mute)}.sm{font-size:14px}
.app{max-width:560px;margin:0 auto;padding:14px 16px 118px}
.wrap{flex-wrap:wrap}.row{display:flex;align-items:center;gap:10px}
.wide{width:100%}
b{font-weight:700}

/* hero */
.hero{background:linear-gradient(155deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:30px 30px 30px 8px;padding:18px 18px 16px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-name{font-weight:700;font-size:16px;opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border:1.5px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:6px}
.cd{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:clamp(34px,11vw,52px);line-height:1.02;letter-spacing:-.025em;white-space:nowrap}
.cd i,.w-cd i{font-style:normal;font-size:.38em;font-weight:700;opacity:.85;margin:0 7px 0 2px}
.cd-msg{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:26px;line-height:1.15;padding:10px 0}
.hero-line{margin:8px 0 0;font-size:16px;line-height:1.8}
.mark{background:var(--mark);color:#141a33;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;display:inline-block;line-height:1.25}
.hero .mark,.widget .mark{color:#141a33}
.ringbox{text-align:center}
.ring{display:block}
.ringtxt{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:22px;fill:currentColor}
.ringcap{font-size:12px;opacity:.85;margin-top:2px}
.hero{--ringbg:rgba(255,255,255,.2);--ringfg:var(--mark)}
.card{--ringbg:var(--line);--ringfg:var(--brand)}
.today{margin-top:14px}
.today-t{font-size:14px;margin-bottom:6px;opacity:.95}
.hero .bar{background:rgba(255,255,255,.22)}
.hero .bar i{background:var(--mark)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.bar{height:8px;border-radius:99px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.bar i.full{background:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;background:var(--field);color:var(--mute);border-radius:99px;padding:3px 10px;margin:0 6px 4px 0}
.chip.live{background:var(--brand);color:var(--brand-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--field);color:var(--ink)}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.mk{background:var(--mark);color:#141a33}
.btn.danger{background:var(--bad);color:#fff}
.btns{display:grid;gap:8px;margin-top:14px}
.icon{border:0;background:transparent;color:var(--mute);font-size:22px;line-height:1;width:36px;height:36px;border-radius:10px;flex:none}
.icon.danger{background:var(--bad);color:#fff;font-size:12px;font-weight:700;width:auto;padding:0 10px}

/* slot cards and topics */
.slot{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:6px 18px 18px 6px;padding:12px 14px;margin-bottom:12px}
.slot.live{border-left-color:var(--brand)}
.slot.done{border-left-color:var(--ok)}
.slot.ended{opacity:.9}
.slot-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.slot-h b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:18px;font-weight:700}
.slot-h .t{color:var(--mute);font-size:14px;display:block;font-weight:500;font-family:Figtree,sans-serif}
.trow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.slot .trow:first-of-type{border-top:1px solid var(--line)}
.trow.done .ttl{text-decoration:line-through;color:var(--mute)}
.tmain{flex:1;min-width:0}
.ttl{font-weight:600;overflow-wrap:anywhere}
.tsub{font-size:13.5px;color:var(--mute);margin-top:3px}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);background:transparent;padding:0;display:grid;place-items:center;margin-top:1px}
.chk svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"] svg{opacity:1}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;margin-top:14px}
.upday{margin-bottom:10px}
.upday>b{display:block;margin-bottom:2px}
.up-s{font-size:14px;color:var(--mute);margin-left:2px}
.up-s b{color:var(--ink)}

/* forms */
.f{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
.f>input,.f>select{display:block;margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:0}
textarea{min-height:140px;resize:vertical;line-height:1.45;margin-bottom:10px}
.hrs{display:flex;align-items:center;gap:4px;flex:none}
.hrs input{width:64px;padding:7px 8px;text-align:center;font-size:15px}
.hrs span{color:var(--mute);font-size:14px}
.slotsel{padding:6px 8px;font-size:14px;margin-top:2px}.flexbtn{border:0;background:var(--field);color:var(--ink);border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700;white-space:nowrap}.flexbtn:active{transform:scale(.98)}.scope{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.scope button{border:1.5px solid var(--line);background:var(--field);border-radius:12px;padding:11px 8px;text-align:left;font-weight:700;color:var(--ink)}.scope button small{display:block;color:var(--mute);font-weight:500;margin-top:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:14px;padding:4px;gap:4px;margin-bottom:8px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,51,.15)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-weight:600}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw span.tg{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw span.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span.tg{background:var(--ok)}
.sw input:checked+span.tg::after{transform:translateX(18px)}
.sw input:focus-visible+span.tg{outline:3px solid var(--brand);outline-offset:2px}
.slotrow{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:8px}
.slotrow input{padding:8px 8px;font-size:15px}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 2px;gap:8px}
.grp b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:17px}
.grp span{font-size:13px;color:var(--mute)}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.subrow{margin-bottom:12px}
.subrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;font-weight:600;margin-bottom:5px}
.days{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.days div{flex:1;text-align:center;font-size:12px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.days i{display:block;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:4px}
.days i.z{background:var(--line)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);background:color-mix(in srgb,var(--surface) 93%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:132px;border:0;background:transparent;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;padding:2px 0}
.nav .ic{width:56px;height:30px;border-radius:99px;display:grid;place-items:center}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:var(--mark);color:#141a33}

/* sheet, toast, banner */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(10,14,35,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.rv-sec{margin-top:12px}
.rv-h{font-weight:700;margin-bottom:4px}
.rv-h span{font-weight:500;color:var(--mute);font-size:14px;margin-left:6px}
.pick{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer}
.pick input{position:absolute;opacity:0;width:0;height:0}
.pick .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center}
.pick input:checked+.tick{background:var(--ok);border-color:var(--ok)}
.pick input:checked+.tick::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pick input:focus-visible+.tick{outline:3px solid var(--brand);outline-offset:2px}
.imp-list{display:grid;gap:8px;margin-top:10px}.imp-item{display:flex;align-items:flex-start;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--field)}.imp-item .pick{margin:0;flex:1;border:0;padding:0;background:transparent}.imp-item .pick:has(input:checked){background:transparent;border-color:transparent}.imp-edit{background:transparent;border:0;padding:2px 0;width:100%;font-weight:600}.imp-edit:focus{background:var(--surface);border:1px solid var(--brand);padding:6px 8px}.imp-x{border:0;background:transparent;color:var(--bad);font-weight:800;font-size:20px;line-height:1;width:30px;height:30px;border-radius:8px}.imp-x:active{background:var(--bad);color:#fff}
.pick:has(input:checked){border-color:var(--ok);background:var(--ok-bg)}
.pick input:disabled+.tick{opacity:.6}
.pt b{display:block;font-weight:600}
.pt small{color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--mark);color:#141a33;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.banner[hidden],.widget[hidden]{display:none}
.banner div{flex:1;min-width:0}
.banner b{display:block;font-size:16px}
.banner span{font-size:14px}
.banner button{border:0;background:#141a33;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}

/* widget view */
.widget{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;--ringbg:rgba(255,255,255,.2);--ringfg:var(--mark)}
.w-x{align-self:flex-end;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:99px;padding:6px 14px;font-weight:600}
.w-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;max-width:520px;width:100%;margin:0 auto}
.w-name{font-size:20px;font-weight:700;opacity:.95}
.w-cd{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:clamp(46px,16vw,76px);line-height:1;letter-spacing:-.03em;white-space:nowrap}
.w-line{font-size:18px;margin:0}
.w-ring .ringtxt{font-size:46px}
.w-pend{font-size:22px;margin:0}
.w-next{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 16px;width:100%;text-align:left}
.w-next b{display:block}
.w-next span{font-size:14.5px;opacity:.9}
.w-tip{font-size:13px;opacity:.75;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.ld-screen{min-height:100vh;box-sizing:border-box;padding:54px 28px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#080b18,#111a3a);color:#fff}
.ld-title{font-size:28px;font-weight:800;margin-bottom:34px}
.ld-count{display:flex;align-items:baseline;gap:7px;font-size:46px;font-weight:900;letter-spacing:-2px}
.ld-count span{font-size:17px;font-weight:700;opacity:.75;margin-right:8px}
.ld-pct{margin:30px 0;font-size:58px;font-weight:900}
.ld-pct small{display:block;font-size:14px;font-weight:600;opacity:.7;letter-spacing:0}
.ld-line{width:min(560px,90%);display:flex;justify-content:space-between;gap:18px;padding:16px 0;border-top:1px solid rgba(255,255,255,.16);text-align:left}
.ld-line span{opacity:.85;text-align:right}
.ld-note{margin-top:30px;font-size:12px;opacity:.55}

</style>
</head>
<body>
<div id="banner" class="banner" role="alert" hidden></div>
<main id="view" class="app"></main>
<nav id="nav" class="nav" aria-label="Main"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheetHost"></div>
<div id="widget" class="widget" hidden></div>
<input type="file" id="file" hidden accept=".txt,.md,.csv,.pdf,.docx,.xlsx,.xls,.jpg,.jpeg,.png,image/jpeg,image/png,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv,text/plain">

<script>
'use strict';
/* ================= helpers ================= */
const KEY='studyplanner.v1', DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const at=(k,hm)=>{const [y,m,d]=k.split('-').map(Number),[h,mi]=hm.split(':').map(Number);return new Date(y,m-1,d,h,mi,0,0)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,t)=>x+t.mins,0);
const fmtT=hm=>{const [h,m]=hm.split(':').map(Number);return `${((h+11)%12)+1}:${pad(m)} ${h>=12?'PM':'AM'}`};
const fmtDur=m=>m<=0?'0h':m%60===0?`${m/60}h`:m<60?`${m}m`:`${+(m/60).toFixed(1)}h`;
const dayLabel=k=>{const t=new Date(),tk=dk(t),nk=dk(new Date(t.getFullYear(),t.getMonth(),t.getDate()+1));
  if(k===tk)return 'Today';if(k===nk)return 'Tomorrow';
  const d=at(k,'00:00');return `${d.toLocaleDateString(undefined,{weekday:'short'})} ${d.getDate()} ${d.toLocaleDateString(undefined,{month:'short'})}`};

/* ================= state ================= */
function defaultExam(){const d=new Date(Date.now()+30*DAY);return `${dk(d)}T10:00`}
const DEFAULTS=()=>({setup:false,mode:'auto',revDays:2,defHours:1,sound:true,notify:true,
  exam:{name:'',date:defaultExam()},
  slots:[{id:'m',label:'Morning',start:'06:00',end:'08:00'},{id:'e',label:'Evening',start:'18:00',end:'20:00'}],
  topics:[],log:{},todayFlex:[],
  front:{header:true,headerText:'',examCountdown:true,schedule:true,dateTime:true},
  lockDisplay:{enabled:false,displayEnabled:true,notifications:true,alarmSound:true,showExam:true,showPercent:true,showToday:true,showNext:true}});
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};try{syncNativePlannerState()}catch(e){}}
let S=Object.assign(DEFAULTS(),load()||{});
S.exam=S.exam&&typeof S.exam==='object'?S.exam:DEFAULTS().exam;
S.slots=Array.isArray(S.slots)&&S.slots.length?S.slots:DEFAULTS().slots;
S.topics=Array.isArray(S.topics)?S.topics:[];
S.log=S.log&&typeof S.log==='object'?S.log:{};
S.todayFlex=Array.isArray(S.todayFlex)?S.todayFlex:[];
S.front=S.front&&typeof S.front==='object'?S.front:{};
S.front=Object.assign(DEFAULTS().front,S.front);
S.lockDisplay=Object.assign(DEFAULTS().lockDisplay,S.lockDisplay);
S.lockDisplay.notifications=S.lockDisplay.notifications!==false;
S.lockDisplay.alarmSound=S.lockDisplay.alarmSound!==false;

/* ================= slots and planning ================= */
const byStart=(a,b)=>a.start.localeCompare(b.start);
const slotById=id=>S.slots.find(s=>s.id===id);
function parseKey(k){if(!k)return null;const [d,id]=k.split('|'),sl=slotById(id);return sl?{d,sl,start:at(d,sl.start),end:at(d,sl.end)}:null}
function slotLabel(k){const p=parseKey(k);return p?`${dayLabel(p.d)}, ${p.sl.label} ${fmtT(p.sl.start)}`:'Not scheduled'}
function examDate(){const d=S.exam.date?new Date(S.exam.date):null;return d&&!isNaN(d)?d:null}
function upcoming(limit){
  const now=new Date(),out=[],sl=[...S.slots].sort(byStart);
  for(let i=0;i<370;i++){
    const day=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),k=dk(day);
    if(limit&&day>limit)break;
    for(const s of sl){
      const st=at(k,s.start),en=at(k,s.end);
      if(en<=now||(limit&&en>limit))continue;
      out.push({key:`${k}|${s.id}`,sl:s,start:st,end:en,mins:(en-st)/6e4});
    }
  }
  return out;
}
function planWindow(){
  const ex=examDate();
  if(!ex)return upcoming(new Date(Date.now()+30*DAY));
  let w=upcoming(new Date(ex.getTime()-S.revDays*DAY));
  if(!w.length)w=upcoming(ex);
  return w;
}
function cleanOrphans(){S.topics.forEach(t=>{if(t.slot&&!parseKey(t.slot))t.slot=null})}
function autoPlan(){
  const pend=S.topics.filter(t=>!t.done);
  if(!pend.length)return;
  const win=planWindow();
  if(!win.length){pend.forEach(t=>t.slot=null);return}
  let i=0;
  for(const s of win){
    let used=0;
    while(i<pend.length&&(used===0||used+pend[i].mins<=s.mins+15)){pend[i].slot=s.key;used+=pend[i].mins;i++}
    if(i>=pend.length)break;
  }
  while(i<pend.length){pend[i].slot=win[win.length-1].key;i++}
}
function replan(){cleanOrphans();if(S.mode==='auto')autoPlan();save();render()}

/* pending slots whose time is over and were not yet reviewed */
function pendingReview(){
  const now=new Date(),keys=[...new Set(S.topics.filter(t=>!t.done&&t.slot).map(t=>t.slot))];
  return keys.map(k=>({k,p:parseKey(k)})).filter(x=>x.p&&x.p.end<=now&&!S.log['r|'+x.k]&&!(snooze[x.k]>Date.now())).sort((a,b)=>a.p.end-b.p.end);
}
/* move unfinished topics of reviewed, finished slots to the next slot(s) */
function rollover(){
  const now=new Date();
  const missed=S.topics.filter(t=>{if(t.done||!t.slot||!S.log['r|'+t.slot])return false;const p=parseKey(t.slot);return p&&p.end<=now});
  if(!missed.length)return{n:0};
  missed.forEach(t=>t.moved=(t.moved||0)+1);
  if(S.mode==='auto')autoPlan();
  else{
    const ex=examDate(),up=upcoming(ex||new Date(Date.now()+30*DAY));
    missed.forEach(t=>t.slot=null);
    for(const t of missed){
      const load=k=>sum(S.topics.filter(x=>!x.done&&x.slot===k));
      const s=up.find(s=>load(s.key)+t.mins<=s.mins)||up[0];
      t.slot=s?s.key:null;
    }
  }
  const first=missed.find(t=>t.slot);
  return{n:missed.length,to:first?slotLabel(first.slot):'a later slot'};
}

/* ================= stats ================= */
function stats(){
  const T=S.topics,tot=sum(T),dn=sum(T.filter(t=>t.done)),pct=tot?Math.round(dn/tot*100):0;
  return{n:T.length,nd:T.filter(t=>t.done).length,tot,dn,left:tot-dn,pct,pend:tot?100-pct:0};
}
function todayLoad(){const k=dk(new Date()),T=S.topics.filter(t=>t.slot&&t.slot.startsWith(k+'|'));return{tot:sum(T),dn:sum(T.filter(t=>t.done))}}
function nextUp(){
  const now=new Date(),keys=[...new Set(S.topics.filter(t=>!t.done&&t.slot).map(t=>t.slot))]
    .map(k=>({k,p:parseKey(k)})).filter(x=>x.p&&x.p.end>now).sort((a,b)=>a.p.start-b.p.start);
  if(!keys.length)return null;
  return{...keys[0],T:S.topics.filter(t=>t.slot===keys[0].k&&!t.done)};
}
function finishAt(){const e=S.topics.filter(t=>!t.done&&t.slot).map(t=>parseKey(t.slot)).filter(Boolean).map(p=>p.end.getTime());return e.length?new Date(Math.max(...e)):null}
function subjects(){const m=new Map();S.topics.forEach(t=>{if(!m.has(t.subject))m.set(t.subject,[]);m.get(t.subject).push(t)});return m}

/* ================= formatting bits ================= */
function fmtMs(ms,f){
  ms=Math.max(0,ms);
  const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  if(f==='words')return `${d} day${d===1?'':'s'} ${h} hour${h===1?'':'s'}`;
  if(f==='hms')return `${pad(h+d*24)}:${pad(m)}:${pad(s)}`;
  if(d>0)return `<b>${d}</b><i>d</i><b>${pad(h)}</b><i>h</i><b>${pad(m)}</b><i>m</i>`;
  return `<b>${pad(h)}</b><i>h</i><b>${pad(m)}</b><i>m</i><b>${pad(s)}</b><i>s</i>`;
}
function tickCountdowns(){
  updateLockDisplay();
  $$('[data-until]').forEach(el=>{
    const v=fmtMs(+el.dataset.until-Date.now(),el.dataset.fmt||'dhm');
    if(el._v!==v){el._v=v;el.innerHTML=v}
  });
}
function ring(pct,size=92,stroke=10){
  const r=(size-stroke)/2,c=2*Math.PI*r,h=size/2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct}% complete"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--ringbg)" stroke-width="${stroke}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--ringfg)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 ${h} ${h})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ringtxt">${pct}%</text></svg>`;
}

function slotCard(sl,k,now){
  const key=`${k}|${sl.id}`,st=at(k,sl.start),en=at(k,sl.end),T=S.topics.filter(t=>t.slot===key);
  const live=now>=st&&now<en,past=now>=en,all=T.length&&T.every(t=>t.done);
  let chip;
  if(all)chip='<span class="chip ok">All done</span>';
  else if(live)chip=`<span class="chip live">Live, ends in <span data-until="${en.getTime()}" data-fmt="hms"></span></span>`;
  else if(past)chip='<span class="chip">Ended</span>';
  else chip=`<span class="chip">Starts in <span data-until="${st.getTime()}" data-fmt="hms"></span></span>`;
  const cls=all?'done':live?'live':past?'ended':'';
  return `<section class="slot ${cls}"><div class="slot-h"><b>${esc(sl.label)}<span class="t">${fmtT(sl.start)} to ${fmtT(sl.end)}</span></b><div>${chip}</div></div>${T.length?T.map(topicRowToday).join(''):`<p class="mute sm" style="margin:6px 0 0">${S.mode==='auto'?'Nothing planned in this slot.':'Nothing assigned. Pick topics for this slot in Plan.'}</p>`}</section>`;

function slotOptions(sel){
  const ex=examDate(),win=upcoming(ex||new Date(Date.now()+30*DAY)).slice(0,90);
  let o='<option value="">Not scheduled</option>',has=false;
  for(const s of win){
    if(s.key===sel)has=true;
    o+=`<option value="${s.key}"${s.key===sel?' selected':''}>${esc(dayLabel(s.key.slice(0,10)))}, ${esc(s.sl.label)} ${fmtT(s.sl.start)}</option>`;
  }
  if(sel&&!has)o=`<option value="${sel}" selected>${esc(slotLabel(sel))} (passed)</option>`+o;
  return o;
}

function chime(){
  if(!ac)return;
  try{
    const seq=[659.25,783.99,987.77,1318.51];let t=ac.currentTime+.05;
    for(let r=0;r<2;r++){
      for(const f of seq){
        const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.45);
        o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.5);t+=.2;
      }
      t+=.35;
    }
  }catch(e){}
}

function checkSlots(){
  const now=new Date(),s=curSig();

  let dirty=false;const groups={};
  S.topics.forEach(t=>{if(t.slot)(groups[t.slot]=groups[t.slot]||[]).push(t)});
  for(const key in groups){

  if(dirty){save();syncNativeAlarms();}
  if(dirty||changed)render();
}

/* ================= syllabus parsing ================= */
function parseSyllabus(text,defMins){
  const out=[];let subject='General';
  for(const raw of text.split(/\r?\n/)){
    let line=raw.trim();if(!line)continue;
    if(/^#{1,3}\s*/.test(line)){subject=line.replace(/^#+\s*/,'').replace(/:$/,'').trim()||subject;continue}
    if(/:$/.test(line)){subject=line.replace(/:$/,'').trim()||subject;continue}
    line=line.replace(/^([-*\u2022\u00b7]|\d+[.)]|[a-z][.)])\s+/i,'').trim();
    let mins=defMins;
    const m=line.match(/[-\u2013\u2014(\[]\s*(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minutes)\s*[)\]]?\s*$/i);
    if(m){const v=parseFloat(m[1]);mins=/^h/i.test(m[2])?Math.round(v*60):Math.round(v);line=line.slice(0,m.index).trim()}
    if(line)out.push({subject,title:line,mins:Math.max(5,mins)});
  }
  return out;
}
function csvToDraft(t){
  const out=[];let cur=null;
  for(const line of t.split(/\r?\n/)){
    if(!line.trim())continue;
    const c=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
    if(/^subject$/i.test(c[0])&&/topic/i.test(c[1]||''))continue;
    if(c.length>=2&&c[1]){
      if(c[0]!==cur){cur=c[0];out.push('# '+cur)}
      out.push(c[1]+(c[2]&&!isNaN(parseFloat(c[2]))?` - ${parseFloat(c[2])}h`:''));
    }else out.push(line);
  }
  return out.join('\n');
}

/* ================= study timer ================= */
function startTimer(id){
  const t=S.topics.find(x=>x.id===id);if(!t||t.done)return;
  const mins=Math.max(1,Math.round(t.mins));
  studyTimer={id,end:Date.now()+mins*60000};
  save();render();toast(`Started ${fmtDur(t.mins)} timer for ${t.title}.`);
}
function stopTimer(){studyTimer={id:null,end:0};render();}
function tickStudyTimer(){
  if(!studyTimer.id||!studyTimer.end)return;
  const t=S.topics.find(x=>x.id===studyTimer.id);
  if(!t){studyTimer={id:null,end:0};return;}
  const left=studyTimer.end-Date.now();
  $$('[data-timer]').forEach(el=>{el.textContent=left>0?fmtMs(left,'hms'):'Done'});
  if(left<=0){const id=studyTimer.id;studyTimer={id:null,end:0};alertUser('Study timer finished',`${t.title} — ${fmtDur(t.mins)} session completed.`);render();}
}
function checkQuickReminders(){
  const k=dk(new Date()),now=new Date(),items=todayFlexRows();
  items.forEach(({x,t})=>{if(t.done)return;const target=at(k,x.time),key=`${k}|${t.id}|${x.time}`;if(now>=target&&now-target<90000&&!reminderLog[key]){reminderLog[key]=1;alertUser('Study reminder',`Time to study: ${t.title}`);}});
}

function toggle(id){
  const t=S.topics.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():null;
  if(!t.done){
    const p=parseKey(t.slot);
    if(!p||p.end<=new Date()){if(S.mode==='auto')autoPlan();else t.slot=null}
  }
  save();render();
  if(t.done&&S.topics.every(x=>x.done))toast('Whole syllabus complete. Well done!');
}

/* ================= universal syllabus file import =================
   PDF -> PDF.js, Word DOCX -> Mammoth, Excel/CSV -> SheetJS,
   JPG/JPEG/PNG -> Tesseract OCR (English + Tamil).
*/
const loadScript=src=>new Promise((resolve,reject)=>{
  const existing=[...document.scripts].find(x=>x.src===src);
  if(existing)return resolve();
  const x=document.createElement('script');x.src=src;x.onload=resolve;x.onerror=reject;document.head.appendChild(x);
});
async function importTextFile(f,ext){
  const txt=await f.text();
  return ext==='csv'?csvToDraft(txt):txt;
}
async function importPdf(f){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  if(!window.pdfjsLib)throw new Error('PDF reader could not load');
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  const out=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const c=await page.getTextContent();
    const items=c.items||[];
    const lines=[];let line='',lastY=null;
    for(const item of items){
      const y=item.transform&&item.transform.length?item.transform[5]:null;
      const txt=String(item.str||'').trim();
      if(!txt)continue;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>3){if(line.trim())lines.push(line.trim());line=txt}
      else line+=(line?' ':'')+txt;
      lastY=y;
    }
    if(line.trim())lines.push(line.trim());
    if(lines.length)out.push(lines.join('\n'));
  }
  if(!out.length)throw new Error('No selectable text found. This may be a scanned PDF; save a page as JPG/PNG and use image OCR.');
  return out.join('\n\n');
}
async function importDocx(f){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js');
  if(!window.mammoth)throw new Error('Word reader could not load');
  const res=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
  return res.value;
}
async function importExcel(f){
  await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  if(!window.XLSX)throw new Error('Excel reader could not load');
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const parts=[];
  wb.SheetNames.forEach(name=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''});
    const lines=rows.map(r=>r.map(v=>String(v).trim()).filter(Boolean).join(' | ')).filter(Boolean);
    if(lines.length)parts.push(`# ${name}\n`+lines.join('\n'));
  });
  return parts.join('\n\n');
}
async function importImageOCR(f){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js');
  if(!window.Tesseract)throw new Error('OCR reader could not load');
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=URL.createObjectURL(f)});
  const scale=2.5,w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
  const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h),d=data.data;
  for(let i=0;i<d.length;i+=4){const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];const v=Math.max(0,Math.min(255,(g-128)*1.8+128));d[i]=d[i+1]=d[i+2]=v;}
  ctx.putImageData(data,0,0);
  const processed=c.toDataURL('image/png');
  const result=await Tesseract.recognize(processed,'eng+tam',{
    logger:m=>{if(m.status==='recognizing text'&&typeof m.progress==='number')toast(`Reading handwriting… ${Math.round(m.progress*100)}%`);},
    tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'
  });
  URL.revokeObjectURL(img.src);
  const txt=(result.data&&result.data.text||'').trim();
  if(!txt)throw new Error('No readable text found. For handwriting, please use the editable review list to correct OCR results before adding.');
  return txt;
}
const MAX_UPLOAD_BYTES=10*1024*1024;
$('#file').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>MAX_UPLOAD_BYTES){toast(`File is too large. Maximum upload size is 10 MB.`);return;}
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  try{
    toast(`Loading ${f.name}…`);
    let txt='';
    if(['txt','md','text','csv'].includes(ext))txt=await importTextFile(f,ext);
    else if(ext==='pdf')txt=await importPdf(f);
    else if(ext==='docx')txt=await importDocx(f);
    else if(['xlsx','xls'].includes(ext))txt=await importExcel(f);
    else if(['jpg','jpeg','png'].includes(ext)||/^image\/(jpeg|png)$/.test(f.type))txt=await importImageOCR(f);
    else throw new Error('Unsupported file. Use PDF, DOCX, XLSX/XLS/CSV, JPG/JPEG/PNG, TXT or Markdown.');
    const list=parseSyllabus(txt,Math.round((S.defHours||1)*60));
    openImportPreview(list,f.name);
  }catch(err){
    console.error(err);toast(err&&err.message?err.message:'Could not read that file.');
  }
});
